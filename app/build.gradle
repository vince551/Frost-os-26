plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vince.frostos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vince.frostos'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '0.1.0-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
